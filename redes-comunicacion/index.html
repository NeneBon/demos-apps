<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vecino — Red social de barrio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #91b5ec; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    background: linear-gradient(135deg, #ff811a, #ff0000);
    color: white; padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1000;
  }
  header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }

  /* === LOGITO === */
  header h1 img {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
  }

  header .badge { background: rgba(255, 0, 0, 0.637); padding: 7px 30px; border-radius: 30px; font-size: 15px; }

  .container { display: flex; flex: 1; overflow: hidden; }

  /* Panel izquierdo*/
  .feed-panel {
    width: 400px; background: rgb(248, 238, 239); display: flex; flex-direction: column;
    border-right: 1px solid #ff6d6d; overflow: hidden;
  }

  .radius-selector {
    padding: 12px; border-bottom: 1px solid #ff0000; display: flex; gap: 8px;
    background: #ffc9a7;
  }
  .radius-selector button {
    flex: 1; padding: 8px; border: 1px solid #ff0000; background: rgb(252, 219, 204);
    border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .2s;
  }
  .radius-selector button.active {
    background: #7e1300; color: white; border-color: #540000;
  }

  .composer { padding: 12px; border-bottom: 1px solid #e5e7eb; }
  .composer textarea {
    width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;
    resize: none; font-size: 14px; height: 60px;
  }
  .composer-actions { display: flex; justify-content: space-between; margin-top: 8px; }
  .composer select {
    padding: 6px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 12px;
  }
  .btn-publish {
    background: #ff3a18; color: white; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn-publish:hover { background: #5e0f02; }

  .feed { flex: 1; overflow-y: auto; padding: 12px; }

  .post {
    background: white; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px; margin-bottom: 12px; animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #fb4416;
    color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
  }
  .post-meta { flex: 1; }
  .post-meta strong { font-size: 14px; display: block; }
  .post-meta span { font-size: 11px; color: #6b7280; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 12px;
    background: #e0e7ff; color: #4f46e5; font-weight: 600;
  }
  .tag.urgente { background: #fee2e2; color: #dc2626; }
  .tag.favor { background: #dcfce7; color: #16a34a; }
  .post-body { font-size: 14px; color: #374151; line-height: 1.4; }
  .post-footer {
    display: flex; gap: 12px; margin-top: 10px; font-size: 12px;
    color: #6b7280; align-items: center;
  }
  .post-footer button {
    background: none; border: none; cursor: pointer; color: #6b7280;
    font-size: 12px; padding: 4px 8px; border-radius: 6px;
  }
  .post-footer button:hover { background: #f3f4f6; color: #f91313; }

  /* Panel derecho: mapa + chat */
  .right-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
  #map { flex: 1; }

  .chat-panel {
    height: 220px; background: white; border-top: 1px solid #e5e7eb;
    display: flex; flex-direction: column;
  }
  .chat-header {
    padding: 10px 16px; background: #fef2f2; border-bottom: 1px solid #fecaca;
    font-size: 13px; font-weight: 600; color: #dc2626;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse { width: 8px; height: 8px; background: #dc2626; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .chat-msg { font-size: 13px; margin-bottom: 6px; }
  .chat-msg .user { font-weight: 600; color: #e04b00; }
  .chat-msg .time { font-size: 10px; color: #9ca3af; margin-left: 6px; }

  .chat-input { display: flex; padding: 8px 16px; gap: 8px; border-top: 1px solid #e5e7eb; }
  .chat-input input {
    flex: 1; padding: 8px 12px; border: 1px solid #d1d5db;
    border-radius: 20px; font-size: 13px;
  }
  .chat-input button {
    background: #ff2525; color: white; border: none; padding: 8px 16px;
    border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;
  }


  .leaflet-popup-content { font-size: 13px; margin: 8px 10px; }
  .leaflet-popup-content strong { color: #00ff40; }

  @media (max-width: 900px) {
    .container { flex-direction: column; }
    .feed-panel { width: 100%; height: 50%; }
  }
</style>
</head>
<body>

<header>
  <h1><img src="ayudaVecina.jpg" alt="Logo Ayuda Vecina">¡Ayuda, Vecina! <span class="badge" id="barrioName">Mi Gente </span></h1>
  <div class="badge">🗺️ Radio: <span id="radiusLabel">500m</span></div>
</header>

<div class="container">
  <!-- Feed -->
  <div class="feed-panel">
    <div class="radius-selector">
      <button data-r="500" class="active">500m</button>
      <button data-r="1000">1km</button>
      <button data-r="2000">2km</button>
    </div>

    <div class="composer">
      <textarea id="postText" placeholder="¿Qué pasa en tu barrio?"></textarea>
      <div class="composer-actions">
        <select id="postType">
          <option value="general">💬 General</option>
          <option value="favor">🤝 Favor / Trueque</option>
          <option value="urgente">❗ Urgente</option>
        </select>
        <button class="btn-publish" onclick="publishPost()">Publicar</button>
      </div>
    </div>

    <div class="feed" id="feed"></div>
  </div>

  <!-- Mapa + chat -->
  <div class="right-panel">
    <div id="map"></div>
    

    <div class="chat-panel">
      <div class="chat-header">
        <span class="pulse"></span> AHORA EN EL BARRIO ✌️
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Enviar</button>
      </div>
    </div>
  </div>
</div>



<script>
// ============ CONFIGURACIÓN ============
const CENTER = [8.904469160676387, -64.24286503383702]; // el tigre
const USER = { name: "Tú", initials: "TÚ" };

let currentRadius = 500;
let posts = [];
let map, userMarker, postsLayer;
let userPos = { lat: CENTER[0], lng: CENTER[1] };

// ============ DATOS DEMO ============
const demoPosts = [
  { id: 1, author: "María G.", initials: "MG", type: "general", text: "¿Alguien sabe si el kiosco de la esquina abre los domingos?", minutesAgo: 5, offset: [0.0008, 0.0005] },
  { id: 2, author: "Carlos R.", initials: "CR", type: "favor", text: "Presto taladro y caja de herramientas. Solo devolver en el día 🙏", minutesAgo: 15, offset: [-0.001, 0.0008] },
  { id: 3, author: "Lucía M.", initials: "LM", type: "urgente", text: "Se cortó el agua en mi casa. ¿A alguien más le pasa? o solo soy yo la salada", minutesAgo: 2, offset: [0.0003, -0.0006] },
  { id: 4, author: "Pedro S.", initials: "PS", type: "general", text: "Se perdió mi gato negro con collar rojo cerca de la plaza. ¡Ayuda!", minutesAgo: 30, offset: [-0.0005, -0.0012] },
  { id: 5, author: "Ana T.", initials: "AT", type: "favor", text: "Busco niñera para el sábado 2h. Pago $500/hora. Zona centro.", minutesAgo: 45, offset: [0.0015, 0.001] },
  { id: 6, author: "Diego F.", initials: "DF", type: "general", text: "Feria de artesanos este sábado en la plaza. ¡Vengan!", minutesAgo: 60, offset: [0.0018, -0.0005] },
  { id: 7, author: "Sofía L.", initials: "SL", type: "urgente", text: "Moto sospechosa dando vueltas hace 20 min por la calle, le voy a meter plomo por si acaso.", minutesAgo: 3, offset: [-0.0015, 0.0015] },
  { id: 8, author: "Gabriela C.", initials: "GC", type: "urgente", text: "¿alguien sabe como quitar manchas dificiles en ropa blanca? me urge😔", minutesAgo: 10, offset: [-0.0011, 0.0011] },
];

const demoChat = [
  { user: "María G.", text: "¿Se acaba de ir la luz por toda la calle, o es que ya me la cortaron por no pagar? 😔", time: "hace 2 min" },
  { user: "Carlos R.", text: "Sí, acá también se fue. Parece que es toda la zona.", time: "hace 1 min" },
  { user: "Lucía M.", text: "Ya llamé a la empresa, dicen que vuelve en 4 horas.", time: "hace 30 seg" },
  { user: "Eneide C.", text: "Coño, y a mi ya no me queda gas ¿ahora como le hago?", time: "hace 32 seg" },
  { user: "Carol F.", text: "Acabo de ver una rata del tamaño de una persona, meterse en el negocio de don lucio 😱", time: "hace 28 seg" },
];

// ============ INICIALIZACIÓN ============
function init() {
  initMap();
  renderFeed();
  renderChat();
  setupRadiusButtons();
  // Simular llegada de mensajes nuevos
  setInterval(simulateNewChat, 8000);
}

function initMap() {
  map = L.map('map').setView(CENTER, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  postsLayer = L.layerGroup().addTo(map);

  // Radio visible
  L.circle(CENTER, { radius: currentRadius, color: '#16a34a', fillColor: '#16a34a', fillOpacity: 0.08, weight: 2 }).addTo(map);

  // Marcador del usuario
  userMarker = L.marker(CENTER, {
    icon: L.divIcon({
      html: '<div style="background:#4f46e5;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',
      className: '', iconSize: [16, 16], iconAnchor: [8, 8]
    })
  }).addTo(map).bindPopup('<strong>Tú estás aquí</strong><br>Barrio Centro');

  // Generar posts con coordenadas
  posts = demoPosts.map(p => ({
    ...p,
    lat: CENTER[0] + p.offset[0],
    lng: CENTER[1] + p.offset[1]
  }));

  updatePostMarkers();
}

// ============ RADIO ============
function setupRadiusButtons() {
  document.querySelectorAll('.radius-selector button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.radius-selector button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRadius = parseInt(btn.dataset.r);
      document.getElementById('radiusLabel').textContent = (currentRadius >= 1000 ? (currentRadius/1000)+'km' : currentRadius+'m');
      updateRadiusCircle();
      renderFeed();
      updatePostMarkers();
    };
  });
}

function updateRadiusCircle() {
  map.eachLayer(l => { if (l instanceof L.Circle) map.removeLayer(l); });
  L.circle(CENTER, { radius: currentRadius, color: '#16a34a', fillColor: '#16a34a', fillOpacity: 0.08, weight: 2 }).addTo(map);
}

// ============ FEED ============
function renderFeed() {
  const feed = document.getElementById('feed');
  const visible = posts.filter(p => distance(CENTER, [p.lat, p.lng]) <= currentRadius);
  feed.innerHTML = '';

  if (visible.length === 0) {
    feed.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:20px;font-size:13px">No hay publicaciones en este radio. ¡Sé el primero!</p>';
    return;
  }

  visible.sort((a,b) => a.minutesAgo - b.minutesAgo).forEach(p => {
    const tagLabel = { general: '💬 General', favor: '🤝 Favor', urgente: '❗ Urgente' }[p.type];
    const tagClass = { general: '', favor: 'favor', urgente: 'urgente' }[p.type];
    feed.innerHTML += `
      <div class="post">
        <div class="post-header">
          <div class="avatar" style="background:${avatarColor(p.author)}">${p.initials}</div>
          <div class="post-meta">
            <strong>${p.author}</strong>
            <span>hace ${p.minutesAgo} min · ${Math.round(distance(CENTER, [p.lat, p.lng]))}m</span>
          </div>
          <span class="tag ${tagClass}">${tagLabel}</span>
        </div>
        <div class="post-body">${p.text}</div>
        <div class="post-footer">
          <button onclick="likePost(${p.id})">👍 Me gusta</button>
          <button onclick="replyPost(${p.id})">💬 Responder</button>
        </div>
      </div>
    `;
  });
}

function publishPost() {
  const text = document.getElementById('postText').value.trim();
  const type = document.getElementById('postType').value;
  if (!text) return;

  const newPost = {
    id: Date.now(),
    author: USER.name,
    initials: USER.initials,
    type,
    text,
    minutesAgo: 0,
    lat: CENTER[0] + (Math.random() - 0.5) * 0.0004,
    lng: CENTER[1] + (Math.random() - 0.5) * 0.0004
  };
  posts.unshift(newPost);
  document.getElementById('postText').value = '';
  renderFeed();
  updatePostMarkers();
}

function likePost(id) {
  const post = posts.find(p => p.id === id);
  if (post) alert(`👍 Le diste me gusta a la publicación de ${post.author}`);
}

function replyPost(id) {
  const post = posts.find(p => p.id === id);
  if (post) alert(`💬 Responder a ${post.author} (demo: función no implementada)`);
}

// ============ MAPA :D ============
function updatePostMarkers() {
  postsLayer.clearLayers();
  posts.forEach(p => {
    if (distance(CENTER, [p.lat, p.lng]) > currentRadius) return;
    const color = { general: '#4f46e5', favor: '#16a34a', urgente: '#dc2626' }[p.type];
    const icon = L.divIcon({
      html: `<div style="background:${color};width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:12px">${p.type==='urgente'?'!':p.type==='favor'?'🤝':'💬'}</div>`,
      className: '', iconSize: [24, 24], iconAnchor: [12, 12]
    });
    L.marker([p.lat, p.lng], { icon }).addTo(postsLayer)
      .bindPopup(`<strong>${p.author}</strong><br>${p.text}<br><small style="color:#6b7280">hace ${p.minutesAgo} min</small>`);
  });
}

// ============ CHAT ============
function renderChat() {
  const chat = document.getElementById('chatMessages');
  chat.innerHTML = demoChat.map(m => `
    <div class="chat-msg"><span class="user">${m.user}:</span> ${m.text} <span class="time">${m.time}</span></div>
  `).join('');
  chat.scrollTop = chat.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  demoChat.push({ user: USER.name, text, time: 'ahora' });
  input.value = '';
  renderChat();
}

function simulateNewChat() {
  const messages = [
    "¿Alguien escuchó el ruido en la calle?",
    "La panadería nueva abre mañana 🥐",
    "Se me cayó la billetera cerca de la plaza, ¿la vieron?",
    "¡Gracias al vecino que me ayudó con las bolsas! 🙌",
    "Corte de luz programado para mañana 9-12hs",
    "por favor, amarren a sus perros, casi muerden a mi abuela",
    "al vecino que sigue dejando su vasura al frente de mi casa, lo voy a machetear si lo llego a atrapar 🔪",
    "vecina laura, ¿aun le quedan catalinas?",
    "NOJODA, COMO CHINGAN CON SU MUSICA A TODO VOLUMEN",
    "Compro dolares",
    "la persona que se cree artista y grafiteo mi carro, que Dios lo agarre confesado",
    "¿Quien, para armar un susu de teléfono?"
  ];
  const users = ["María Gomez.", "Carlos Rojas.", "Lucía Maria.", "Pedro Santos.", "Ana Trujillo.", "Juan Vicente Del Toro","Mark Addams"];
  demoChat.push({
    user: users[Math.floor(Math.random() * users.length)],
    text: messages[Math.floor(Math.random() * messages.length)],
    time: 'ahora'
  });
  renderChat();
}

// ============ UTILIDADES ============
function distance(a, b) {
  const R = 6371000;
  const dLat = (b[0]-a[0]) * Math.PI/180;
  const dLon = (b[1]-a[1]) * Math.PI/180;
  const lat1 = a[0] * Math.PI/180, lat2 = b[0] * Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function avatarColor(name) {
  const colors = ['#4f46e5','#7c3aed','#dc2626','#16a34a','#ea580c','#0891b2'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

init();
</script>
</body>
</html>
