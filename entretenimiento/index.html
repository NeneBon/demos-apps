<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cine-Mals — Tu streaming personalizado</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-2: #13131a;
    --panel: #1a1a24;
    --border: #2a2a38;
    --text: #f5f5f7;
    --muted: #8b8b9a;
    --accent: #e50914;
    --accent-hover: #f6121d;
    --gold: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(79, 70, 229, 0.35), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(139, 92, 246, 0.30), transparent 55%),
      linear-gradient(135deg, #0a0a1f 0%, #14102b 40%, #1a0f2e 70%, #0f0a1f 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    overscroll-behavior-y: none;
  }

  /* NAVBAR */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    padding-top: max(16px, env(safe-area-inset-top));
    transition: background .3s;
    background: linear-gradient(180deg, rgba(15, 10, 31, .95), rgba(15, 10, 31, 0));
    gap: 12px;
  }
  .navbar.scrolled {
    background: rgba(20, 16, 43, .95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav-left { display: flex; align-items: center; gap: 32px; min-width: 0; }

  /* LOGO */
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .logo-img {
    width: 40px; height: 40px;
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
    box-shadow: 0 0 0 2px rgba(139, 92, 246, .35), 0 4px 12px rgba(79, 70, 229, .4);
  }
  .logo-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .logo-text {
    background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  .nav-links { display: flex; gap: 20px; }
  .nav-links a {
    color: var(--muted); text-decoration: none; font-size: 14px;
    transition: color .15s; cursor: pointer;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }

  .nav-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    border-radius: 24px; padding: 8px 16px; transition: all .2s;
    width: 200px;
  }
  .search-box:focus-within { width: 280px; background: rgba(255,255,255,.12); border-color: #8b5cf6; }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; flex: 1; min-width: 0;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--muted); }

  .avatar {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; cursor: pointer;
    flex-shrink: 0;
  }

  /* HERO */
  .hero {
    height: 70vh; min-height: 500px; position: relative;
    display: flex; align-items: flex-end; padding: 0 40px 60px;
    overflow: hidden;
    background: transparent;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0.22;
    mix-blend-mode: screen;
  }
  .hero-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(10, 10, 31, 0.05) 0%,
      rgba(20, 16, 43, 0.30) 55%,
      #0f0a1f 100%
    );
  }
  .hero-content { position: relative; z-index: 2; max-width: 600px; }
  .hero-tag {
    display: inline-block; background: var(--accent); color: white;
    padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700;
    letter-spacing: .5px; margin-bottom: 14px;
  }
  .hero h1 { font-size: 56px; font-weight: 800; line-height: 1; margin-bottom: 16px; letter-spacing: -1.5px; }
  .hero-meta { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .hero-meta .star { color: var(--gold); }
  .hero p { font-size: 15px; line-height: 1.5; color: #d1d1d8; margin-bottom: 24px; max-width: 500px; }
  .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    padding: 12px 28px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .15s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn-primary { background: white; color: black; }
  .btn-primary:hover { background: #e0e0e0; }
  .btn-secondary { background: rgba(255,255,255,.15); color: white; backdrop-filter: blur(8px); }
  .btn-secondary:hover { background: rgba(255,255,255,.25); }

  /* CONTENT */
  .content { padding: 0 40px 80px; position: relative; z-index: 3; margin-top: -40px; }

  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; margin-top: 32px;
    flex-wrap: wrap; gap: 8px;
  }
  .section-title { font-size: 22px; font-weight: 700; }
  .section-subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* Genre chips */
  .genre-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 24px; }
  .chip {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px;
    cursor: pointer; transition: all .15s; font-weight: 500;
    font-family: inherit;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--text); color: var(--text); }
  .chip.active {
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
    border-color: transparent;
    color: white;
  }

  /* Movie rows */
  .movie-row {
    display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 16px;
    scroll-behavior: smooth; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .movie-row::-webkit-scrollbar { display: none; }

  .movie-card {
    flex: 0 0 200px; cursor: pointer;
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .movie-card:hover { transform: scale(1.06); z-index: 10; }
  .movie-poster {
    width: 100%; aspect-ratio: 2/3; border-radius: 10px;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: box-shadow .3s;
  }
  .movie-card:hover .movie-poster { box-shadow: 0 16px 40px rgba(0,0,0,.7); }
  .movie-poster-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: 800;
    color: rgba(255,255,255,.9); text-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .movie-overlay {
    position: absolute; inset: 0; padding: 14px;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.9) 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; transition: opacity .2s;
  }
  .movie-card:hover .movie-overlay { opacity: 1; }
  .movie-overlay h3 { font-size: 15px; margin-bottom: 4px; word-wrap: break-word; }
  .movie-overlay .meta { font-size: 11px; color: var(--muted); }
  .movie-overlay .actions { display: flex; gap: 6px; margin-top: 10px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; transition: all .15s; backdrop-filter: blur(4px);
    touch-action: manipulation;
    font-family: inherit;
  }
  .icon-btn:hover { background: rgba(255,255,255,.3); transform: scale(1.1); }
  .icon-btn.saved { background: #8b5cf6; border-color: #8b5cf6; }

  .movie-title-below { margin-top: 8px; font-size: 13px; font-weight: 600; word-wrap: break-word; }
  .movie-meta-below { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
    grid-column: 1 / -1; width: 100%;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 5, 20, .85);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeIn .2s;
    overflow-y: auto;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--panel); border-radius: 16px; overflow: hidden;
    max-width: 900px; width: 100%; max-height: 90vh;
    overflow-y: auto; animation: slideUp .3s cubic-bezier(.4,0,.2,1);
    border: 1px solid var(--border);
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-hero { height: 280px; position: relative; display: flex; align-items: flex-end; padding: 30px; }
  .modal-hero-bg { position: absolute; inset: 0; }
  .modal-hero-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--panel) 100%); }
  .modal-hero-content { position: relative; z-index: 2; }
  .modal-hero h2 { font-size: 36px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; word-wrap: break-word; }
  .modal-hero .meta { display: flex; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }

  .modal-body { padding: 24px 30px 30px; }
  .modal-body p { font-size: 14px; line-height: 1.7; color: #c8c8d2; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

  .star-rating { display: flex; gap: 4px; font-size: 22px; }
  .star-rating .star {
    cursor: pointer; color: #404050; transition: color .15s;
    touch-action: manipulation;
    padding: 4px;
  }
  .star-rating .star.filled { color: var(--gold); }
  .star-rating .star:hover { transform: scale(1.15); }

  /* PLAYER OVERLAY */
  .player {
    position: fixed; inset: 0; background: black; z-index: 2000;
    display: none; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .player.show { display: flex; }
  .player-content { width: 100%; max-width: 1000px; padding: 40px; text-align: center; }
  .player h2 { font-size: 28px; margin-bottom: 24px; word-wrap: break-word; }
  .player-screen {
    aspect-ratio: 16/9; background: #000; border-radius: 12px;
    position: relative; overflow: hidden; margin-bottom: 20px;
    border: 1px solid #222;
  }
  .player-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: .4;
  }
  .player-play-icon {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 80px; color: rgba(255,255,255,.6);
    animation: pulse-play 1.5s infinite;
  }
  @keyframes pulse-play { 0%,100% { opacity: .6; } 50% { opacity: .3; } }
  .player-progress {
    height: 4px; background: #222; border-radius: 2px; overflow: hidden;
    margin-top: 20px;
  }
  .player-progress-fill {
    height: 100%; background: linear-gradient(90deg, #4f46e5, #8b5cf6); width: 0%;
    transition: width .3s linear;
  }
  .player-time {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .player-close {
    position: absolute; top: 20px; right: 20px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.1); border: none;
    color: white; font-size: 20px; cursor: pointer;
    transition: background .15s;
    touch-action: manipulation;
    z-index: 10;
  }
  .player-close:hover { background: rgba(255,255,255,.2); }

  /* TOAST */
  .toast {
    position: fixed; bottom: max(30px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text); color: var(--bg); padding: 12px 24px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all .3s; z-index: 9999; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0f0a1f; }
  ::-webkit-scrollbar-thumb { background: #2d2d4a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }

  /* ========== RESPONSIVE ========== */

  /* Inputs 16px en móvil para evitar zoom iOS */
  @media (max-width: 768px) {
    .search-box input { font-size: 16px; }
  }

  @media (max-width: 768px) {
    .navbar {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      gap: 8px;
    }
    .nav-links { display: none; }
    .nav-left { gap: 0; flex: 1; min-width: 0; }
    .logo { font-size: 17px; gap: 8px; }
    .logo-img { width: 32px; height: 32px; border-radius: 8px; }
    .nav-right { gap: 8px; flex-shrink: 0; }
    .search-box {
      width: 40px; padding: 8px;
      justify-content: center;
      transition: width .25s;
      min-width: 40px;
    }
    .search-box span { font-size: 15px; }
    .search-box input {
      width: 0; padding: 0; opacity: 0;
      transition: all .25s;
    }
    .search-box.expanded {
      width: 200px;
      padding: 8px 12px;
      justify-content: flex-start;
    }
    .search-box.expanded input {
      width: auto; opacity: 1; flex: 1; padding: 0;
    }
    .search-box.expanded span { font-size: 13px; }
    .avatar { width: 32px; height: 32px; font-size: 12px; }

    .hero {
      padding: 0 16px 40px;
      height: 65vh; min-height: 420px;
      align-items: flex-end;
    }
    .hero h1 { font-size: 32px; letter-spacing: -0.8px; }
    .hero p { font-size: 13px; }
    .hero-meta { font-size: 12px; gap: 10px; }
    .hero-tag { font-size: 10px; padding: 3px 10px; }
    .hero-buttons .btn { padding: 11px 20px; font-size: 13px; }

    .content { padding: 0 16px 60px; margin-top: -30px; }
    .section-title { font-size: 18px; }
    .section-subtitle { font-size: 12px; }
    .section-header { margin-top: 24px; }

    .movie-card { flex: 0 0 130px; }
    .movie-poster-bg { font-size: 42px; }
    .movie-overlay { opacity: 1; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.85) 100%); padding: 10px; }
    .movie-overlay h3 { font-size: 12px; }
    .movie-overlay .meta { font-size: 10px; }
    .movie-overlay .actions { gap: 4px; margin-top: 6px; }
    .icon-btn { width: 30px; height: 30px; font-size: 12px; }
    .movie-title-below { font-size: 12px; }
    .movie-meta-below { font-size: 10px; }

    .chip { padding: 7px 14px; font-size: 12px; }

    .modal-overlay { padding: 12px; }
    .modal { border-radius: 14px; max-height: 92vh; }
    .modal-hero { height: 200px; padding: 20px; }
    .modal-hero h2 { font-size: 22px; }
    .modal-hero .meta { font-size: 11px; gap: 10px; }
    .modal-body { padding: 18px 18px 24px; }
    .modal-body p { font-size: 13px; }
    .modal-actions .btn { padding: 10px 18px; font-size: 13px; flex: 1; justify-content: center; }
    .star-rating { font-size: 28px; gap: 6px; }
    .star-rating .star { padding: 6px; }

    .player-content { padding: 20px 16px; }
    .player h2 { font-size: 20px; margin-bottom: 16px; }
    .player-play-icon { font-size: 56px; }
    .player-close { top: max(16px, env(safe-area-inset-top)); right: 16px; width: 40px; height: 40px; }
  }

  @media (max-width: 420px) {
    .hero h1 { font-size: 26px; }
    .hero { min-height: 380px; height: 60vh; }
    .hero-buttons { gap: 8px; }
    .hero-buttons .btn { flex: 1; justify-content: center; padding: 10px 14px; font-size: 12px; }
    .movie-card { flex: 0 0 115px; }
    .section-title { font-size: 16px; }
    .logo { font-size: 16px; }
    .logo-img { width: 30px; height: 30px; }
    .avatar { display: none; }
    .search-box.expanded { width: 160px; }
    .modal-hero { height: 170px; padding: 16px; }
    .modal-hero h2 { font-size: 20px; }
    .modal-body { padding: 16px; }
    .star-rating { font-size: 26px; }
  }

  /* Landscape móvil */
  @media (max-width: 900px) and (orientation: landscape) {
    .hero { height: 90vh; min-height: 300px; padding-bottom: 30px; }
    .hero h1 { font-size: 30px; }
  }

  /* Touch: neutralizar hover pegajoso y mostrar overlay */
  @media (hover: none) {
    .movie-card:hover { transform: none; }
    .movie-card:hover .movie-poster { box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .movie-overlay { opacity: 1; }
    .btn-primary:hover { background: white; }
    .btn-secondary:hover { background: rgba(255,255,255,.15); }
    .icon-btn:hover { background: rgba(255,255,255,.15); transform: none; }
    .icon-btn.saved:hover { background: #8b5cf6; }
    .chip:hover { border-color: var(--border); color: var(--muted); }
    .chip.active:hover { border-color: transparent; color: white; }
    .star-rating .star:hover { transform: none; }
    .nav-links a:hover { color: var(--muted); }
    .nav-links a.active:hover { color: var(--text); }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-left">
    <div class="logo">
      <div class="logo-img">
        <img src="cineanimal.jpg" alt="Cine-mals">
      </div>
      <span class="logo-text">Cine-Mals</span>
    </div>
    <div class="nav-links">
      <a class="active" onclick="scrollToSection('inicio')">Inicio</a>
      <a onclick="scrollToSection('tendencias')">Tendencias</a>
      <a onclick="scrollToSection('mi-lista')">Mi lista</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="search-box" id="searchBox">
      <span onclick="toggleSearch()">🔍</span>
      <input id="searchInput" placeholder="Buscar..." oninput="handleSearch()">
    </div>
    <div class="avatar" title="Tu perfil">TÚ</div>
  </div>
</nav>

<!-- HERO -->
<div class="hero" id="inicio">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-gradient"></div>
  <div class="hero-content">
    <span class="hero-tag">⭐ DESTACADA</span>
    <h1 id="heroTitle"></h1>
    <div class="hero-meta" id="heroMeta"></div>
    <p id="heroDesc"></p>
    <div class="hero-buttons">
      <button class="btn btn-primary" onclick="playHero()">▶ Reproducir</button>
      <button class="btn btn-secondary" onclick="openModal(heroMovie)">+ Más info</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <!-- Search results -->
  <div id="searchResults" style="display:none">
    <div class="section-header">
      <div>
        <div class="section-title">Resultados de búsqueda</div>
        <div class="section-subtitle" id="searchCount"></div>
      </div>
    </div>
    <div class="movie-row" id="searchRow" style="flex-wrap:wrap;overflow:visible"></div>
  </div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="genre-chips" id="genreChips"></div>

    <div id="rowsContainer"></div>

    <!-- Mi lista -->
    <div class="section-header" id="mi-lista">
      <div>
        <div class="section-title">❤️ Mi lista</div>
        <div class="section-subtitle" id="myListCount">0 películas guardadas</div>
      </div>
    </div>
    <div class="movie-row" id="myListRow" style="flex-wrap:wrap;overflow:visible"></div>

    <!-- Recomendaciones -->
    <div class="section-header">
      <div>
        <div class="section-title">🎯 Recomendado para vos</div>
        <div class="section-subtitle" id="recSubtitle">Basado en tus favoritos</div>
      </div>
    </div>
    <div class="movie-row" id="recommendedRow" style="flex-wrap:wrap;overflow:visible"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hero">
      <div class="modal-hero-bg" id="modalBg"></div>
      <div class="modal-hero-gradient"></div>
      <div class="modal-hero-content">
        <h2 id="modalTitle"></h2>
        <div class="meta" id="modalMeta"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-actions" id="modalActions"></div>
      <p id="modalDesc"></p>
      <div style="margin-bottom:8px;font-size:13px;color:var(--muted)">Tu puntuación:</div>
      <div class="star-rating" id="starRating"></div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
  <button class="player-close" onclick="closePlayer()">✕</button>
  <div class="player-content">
    <h2 id="playerTitle"></h2>
    <div class="player-screen">
      <div class="player-bg" id="playerBg"></div>
      <div class="player-play-icon">▶</div>
    </div>
    <div class="player-progress"><div class="player-progress-fill" id="playerProgress"></div></div>
    <div class="player-time">
      <span id="playerCurrent">0:00</span>
      <span id="playerDuration">1:45:00</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ CATÁLOGO ============
const MOVIES = [
  { id: 1, title: "El Último Horizonte", year: 2024, rating: 8.7, duration: 128, genres: ["Sci-Fi", "Drama"], desc: "En un futuro donde la Tierra agoniza, una astronauta debe tomar la decisión más difícil de su vida: quedarse o partir hacia lo desconocido.", colors: ["#1e3a8a", "#3b82f6", "#8b5cf6"], tag: "Tendencias" },
  { id: 2, title: "Sombras de la Ciudad", year: 2023, rating: 8.2, duration: 142, genres: ["Thriller", "Crimen"], desc: "Un detective retirado vuelve a las calles para resolver un caso que lo persigue desde hace veinte años.", colors: ["#0f172a", "#1e293b", "#475569"], tag: "Tendencias" },
  { id: 3, title: "Risas en el Aire", year: 2024, rating: 7.5, duration: 98, genres: ["Comedia", "Romance"], desc: "Dos desconocidos quedan atrapados en un vuelo y descubren que tienen más en común de lo que pensaban.", colors: ["#f59e0b", "#ec4899", "#8b5cf6"], tag: "Novedades" },
  { id: 4, title: "El Silencio del Bosque", year: 2022, rating: 8.9, duration: 156, genres: ["Drama", "Misterio"], desc: "Una familia se muda a una cabaña remota y descubre que el bosque guarda secretos que no deberían despertarse.", colors: ["#064e3b", "#065f46", "#10b981"], tag: "Mejor valoradas" },
  { id: 5, title: "Fuego Cruzado", year: 2024, rating: 8.1, duration: 118, genres: ["Acción", "Thriller"], desc: "Un exmilitar debe proteger a un testigo clave mientras una organización criminal lo persigue por toda la ciudad.", colors: ["#dc2626", "#f59e0b", "#7c2d12"], tag: "Tendencias" },
  { id: 6, title: "Estrellas Fugaces", year: 2023, rating: 8.5, duration: 112, genres: ["Romance", "Drama"], desc: "Dos almas solitarias se cruzan en una noche de verano que cambiará sus vidas para siempre.", colors: ["#7c3aed", "#ec4899", "#f97316"], tag: "Mejor valoradas" },
  { id: 7, title: "Código Roto", year: 2024, rating: 7.8, duration: 134, genres: ["Sci-Fi", "Thriller"], desc: "Un hacker descubre un mensaje oculto en el código de una IA que podría destruir la civilización.", colors: ["#0f172a", "#4f46e5", "#06b6d4"], tag: "Novedades" },
  { id: 8, title: "Bajo la Lluvia", year: 2022, rating: 8.3, duration: 108, genres: ["Drama", "Romance"], desc: "Una periodista vuelve a su pueblo natal y enfrenta los fantasmas del pasado que dejó atrás.", colors: ["#1e3a8a", "#64748b", "#94a3b8"], tag: "Mejor valoradas" },
  { id: 9, title: "El Gran Golpe", year: 2023, rating: 7.9, duration: 126, genres: ["Acción", "Crimen"], desc: "Un grupo de ladrones de élite planea el robo del siglo en el corazón de la ciudad.", colors: ["#92400e", "#d97706", "#fbbf24"], tag: "Tendencias" },
  { id: 10, title: "Secretos de Familia", year: 2024, rating: 8.4, duration: 140, genres: ["Drama", "Misterio"], desc: "Una herencia inesperada revela secretos que una familia luchó por mantener enterrados durante décadas.", colors: ["#7f1d1d", "#dc2626", "#fca5a5"], tag: "Novedades" },
  { id: 11, title: "Rumbo al Mañana", year: 2023, rating: 8.0, duration: 116, genres: ["Sci-Fi", "Aventura"], desc: "Una tripulación viaja más allá del sistema solar en busca de un nuevo hogar para la humanidad.", colors: ["#1e40af", "#3b82f6", "#a855f7"], tag: "Mejor valoradas" },
  { id: 12, title: "El Jardín Secreto", year: 2024, rating: 7.6, duration: 92, genres: ["Aventura", "Fantasía"], desc: "Un niño descubre un jardín mágico escondido en el patio de su abuela que lo transporta a otros mundos.", colors: ["#065f46", "#16a34a", "#fbbf24"], tag: "Novedades" },
  { id: 13, title: "Último Round", year: 2022, rating: 8.6, duration: 130, genres: ["Drama", "Deportes"], desc: "Un boxeador en el ocaso de su carrera tiene una última oportunidad para redimirse en el ring.", colors: ["#b45309", "#dc2626", "#fde047"], tag: "Mejor valoradas" },
  { id: 14, title: "Invasión Silenciosa", year: 2024, rating: 7.7, duration: 122, genres: ["Sci-Fi", "Acción"], desc: "Cuando los extraterrestres llegan sin disparar un solo tiro, la humanidad debe descubrir qué quieren realmente.", colors: ["#0f172a", "#1e40af", "#6b7280"], tag: "Tendencias" },
  { id: 15, title: "La Receta Perfecta", year: 2023, rating: 7.4, duration: 102, genres: ["Comedia", "Drama"], desc: "Un chef con estrella Michelin regresa al restaurante familiar para salvar el negocio de la ruina.", colors: ["#b91c1c", "#f97316", "#fbbf24"], tag: "Novedades" },
  { id: 16, title: "Tierra de Nadie", year: 2022, rating: 8.8, duration: 148, genres: ["Drama", "Guerra"], desc: "Dos soldados de bandos opuestos quedan atrapados juntos y deben cooperar para sobrevivir.", colors: ["#374151", "#78716c", "#a8a29e"], tag: "Mejor valoradas" },
  { id: 17, title: "La Casa del Lago", year: 2024, rating: 8.2, duration: 114, genres: ["Misterio", "Thriller"], desc: "Una pareja de escritores se muda a una casa junto al lago que guarda un oscuro pasado.", colors: ["#0f172a", "#1e3a8a", "#0ea5e9"], tag: "Novedades" },
  { id: 18, title: "El Poder de un Sueño", year: 2023, rating: 8.5, duration: 124, genres: ["Drama", "Musical"], desc: "Una joven cantante de barrio lucha por llegar al escenario más importante del mundo.", colors: ["#7c2d12", "#ec4899", "#fbbf24"], tag: "Tendencias" },
  { id: 19, title: "Cacería Nocturna", year: 2024, rating: 7.9, duration: 106, genres: ["Acción", "Thriller"], desc: "Una noche, una ciudad, un asesino. Un policía tiene 12 horas para atraparlo antes del amanecer.", colors: ["#0f172a", "#7f1d1d", "#dc2626"], tag: "Novedades" },
  { id: 20, title: "El Secreto del Océano", year: 2022, rating: 8.1, duration: 120, genres: ["Aventura", "Fantasía"], desc: "Una expedición submarina descubre una civilización perdida que guarda la clave de la evolución humana.", colors: ["#0c4a6e", "#0ea5e9", "#06b6d4"], tag: "Mejor valoradas" },
  { id: 21, title: "Amor en Tiempos Modernos", year: 2024, rating: 7.3, duration: 95, genres: ["Comedia", "Romance"], desc: "Dos personas que se conocen por error en una app de citas descubren que trabajan en la misma empresa.", colors: ["#ec4899", "#f472b6", "#fbbf24"], tag: "Novedades" },
  { id: 22, title: "El Último Testigo", year: 2023, rating: 8.4, duration: 136, genres: ["Crimen", "Misterio"], desc: "El único testigo de un crimen es un anciano que perdió la memoria hace veinte años.", colors: ["#1e293b", "#334155", "#475569"], tag: "Tendencias" },
  { id: 23, title: "Aventura Espacial", year: 2024, rating: 7.8, duration: 110, genres: ["Sci-Fi", "Comedia"], desc: "Una misión espacial sale mal cuando la tripulación descubre que el capitán es un robot con crisis existencial.", colors: ["#4f46e5", "#8b5cf6", "#ec4899"], tag: "Novedades" },
  { id: 24, title: "Raíces", year: 2022, rating: 8.7, duration: 144, genres: ["Drama", "Histórico"], desc: "Tres generaciones de una familia inmigrante tejen su historia en un nuevo continente.", colors: ["#78350f", "#d97706", "#fcd34d"], tag: "Mejor valoradas" }
];

const ALL_GENRES = [...new Set(MOVIES.flatMap(m => m.genres))].sort();

// ============ ESTADO ============
let state = {
  myList: [],
  ratings: {},
  activeGenre: null,
  search: ''
};

let heroMovie = MOVIES[0];
let currentModalId = null;

// ============ PERSISTENCIA ============
function save() {
  localStorage.setItem('cineclub', JSON.stringify({
    myList: state.myList,
    ratings: state.ratings
  }));
}
function load() {
  const raw = localStorage.getItem('cineclub');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      state.myList = data.myList || [];
      state.ratings = data.ratings || {};
    } catch(e) { console.error(e); }
  }
}

// ============ UTILS ============
function gradientFor(movie) {
  return `linear-gradient(135deg, ${movie.colors[0]}, ${movie.colors[1]}, ${movie.colors[2]})`;
}
function initials(title) {
  return title.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}
function formatDuration(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ BÚSQUEDA MÓVIL ============
function toggleSearch() {
  const box = document.getElementById('searchBox');
  box.classList.toggle('expanded');
  if (box.classList.contains('expanded')) {
    setTimeout(() => document.getElementById('searchInput').focus(), 100);
  } else {
    // Al cerrar, limpiamos la búsqueda
    document.getElementById('searchInput').value = '';
    handleSearch();
  }
}

// ============ HERO ============
function renderHero() {
  document.getElementById('heroBg').style.background = gradientFor(heroMovie);
  document.getElementById('heroTitle').textContent = heroMovie.title;
  document.getElementById('heroMeta').innerHTML = `
    <span class="star">★ ${heroMovie.rating}</span>
    <span>${heroMovie.year}</span>
    <span>${formatDuration(heroMovie.duration)}</span>
    <span>${heroMovie.genres.join(' · ')}</span>
  `;
  document.getElementById('heroDesc').textContent = heroMovie.desc;
}

// ============ GÉNEROS ============
function renderGenres() {
  const chips = document.getElementById('genreChips');
  chips.innerHTML = `
    <button class="chip ${!state.activeGenre ? 'active' : ''}" onclick="setGenre(null)">Todos</button>
    ${ALL_GENRES.map(g => `
      <button class="chip ${state.activeGenre === g ? 'active' : ''}" onclick="setGenre('${g}')">${g}</button>
    `).join('')}
  `;
}

function setGenre(g) {
  state.activeGenre = g;
  renderGenres();
  renderRows();
}

// ============ ROWS ============
function renderRows() {
  const container = document.getElementById('rowsContainer');
  const rows = [
    { id: 'tendencias', title: '🔥 Tendencias', filter: m => m.tag === 'Tendencias' },
    { id: 'novedades', title: '✨ Novedades', filter: m => m.tag === 'Novedades' },
    { id: 'mejor', title: '⭐ Mejor valoradas', filter: m => m.tag === 'Mejor valoradas' }
  ];

  let html = '';
  rows.forEach(row => {
    let movies = MOVIES.filter(row.filter);
    if (state.activeGenre) movies = movies.filter(m => m.genres.includes(state.activeGenre));
    if (movies.length === 0) return;

    html += `
      <div class="section-header" id="${row.id}">
        <div class="section-title">${row.title}</div>
      </div>
      <div class="movie-row">
        ${movies.map(movieCardHTML).join('')}
      </div>
    `;
  });
  container.innerHTML = html;
}

function movieCardHTML(m) {
  const saved = state.myList.includes(m.id);
  return `
    <div class="movie-card" onclick="openModal(MOVIES.find(x => x.id === ${m.id}))">
      <div class="movie-poster">
        <div class="movie-poster-bg" style="background:${gradientFor(m)}">${initials(m.title)}</div>
        <div class="movie-overlay">
          <h3>${m.title}</h3>
          <div class="meta">${m.year} · ★ ${m.rating}</div>
          <div class="actions" onclick="event.stopPropagation()">
            <button class="icon-btn" title="Reproducir" onclick="playMovie(${m.id})">▶</button>
            <button class="icon-btn ${saved ? 'saved' : ''}" title="${saved ? 'Quitar' : 'Guardar'}" onclick="toggleList(${m.id})">
              ${saved ? '✓' : '+'}
            </button>
          </div>
        </div>
      </div>
      <div class="movie-title-below">${m.title}</div>
      <div class="movie-meta-below">${m.year} · ${m.genres[0]}</div>
    </div>
  `;
}

// ============ MI LISTA ============
function renderMyList() {
  const row = document.getElementById('myListRow');
  const count = document.getElementById('myListCount');
  const movies = MOVIES.filter(m => state.myList.includes(m.id));

  count.textContent = `${movies.length} película${movies.length !== 1 ? 's' : ''} guardada${movies.length !== 1 ? 's' : ''}`;

  if (movies.length === 0) {
    row.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>Tu lista está vacía. Guardá películas con el botón + en cada poster.</p>
      </div>
    `;
  } else {
    row.innerHTML = movies.map(movieCardHTML).join('');
  }
}

function toggleList(id) {
  const idx = state.myList.indexOf(id);
  const movie = MOVIES.find(m => m.id === id);
  if (idx >= 0) {
    state.myList.splice(idx, 1);
    toast(`Quitada de Mi lista: ${movie.title}`);
  } else {
    state.myList.push(id);
    toast(`Guardada: ${movie.title} ❤️`);
  }
  save();
  renderRows();
  renderMyList();
  renderRecommendations();
  if (currentModalId === id) openModal(movie);
}

// ============ RECOMENDACIONES ============
function renderRecommendations() {
  const row = document.getElementById('recommendedRow');
  const sub = document.getElementById('recSubtitle');

  if (state.myList.length === 0) {
    sub.textContent = 'Guardá películas en Mi lista para ver recomendaciones personalizadas';
    row.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎯</div>
        <p>El recomendador aprende de tus gustos. Guardá 2-3 películas para empezar.</p>
      </div>
    `;
    return;
  }

  const genreCount = {};
  state.myList.forEach(id => {
    const m = MOVIES.find(x => x.id === id);
    if (m) m.genres.forEach(g => genreCount[g] = (genreCount[g] || 0) + 1);
  });

  const topGenres = Object.entries(genreCount)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([g]) => g);

  const scored = MOVIES
    .filter(m => !state.myList.includes(m.id))
    .map(m => {
      const score = m.genres.reduce((sum, g) => sum + (genreCount[g] || 0), 0) + m.rating / 10;
      return { movie: m, score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 6);

  sub.textContent = `Porque te gusta: ${topGenres.join(', ')}`;
  row.innerHTML = scored.map(s => movieCardHTML(s.movie)).join('');
}

// ============ BÚSQUEDA ============
function handleSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  state.search = q;
  const results = document.getElementById('searchResults');
  const main = document.getElementById('mainContent');

  if (!q) {
    results.style.display = 'none';
    main.style.display = 'block';
    return;
  }

  const matches = MOVIES.filter(m =>
    m.title.toLowerCase().includes(q) ||
    m.genres.some(g => g.toLowerCase().includes(q)) ||
    m.desc.toLowerCase().includes(q)
  );

  results.style.display = 'block';
  main.style.display = 'none';
  document.getElementById('searchCount').textContent = `${matches.length} resultado${matches.length !== 1 ? 's' : ''} para "${q}"`;
  document.getElementById('searchRow').innerHTML = matches.length
    ? matches.map(movieCardHTML).join('')
    : '<div class="empty-state"><div class="icon">🔍</div><p>No encontramos películas con ese nombre.</p></div>';
}

// ============ MODAL ============
function openModal(movie) {
  if (!movie) return;
  currentModalId = movie.id;
  document.getElementById('modalBg').style.background = gradientFor(movie);
  document.getElementById('modalTitle').textContent = movie.title;
  document.getElementById('modalMeta').innerHTML = `
    <span style="color:var(--gold)">★ ${movie.rating}</span>
    <span>${movie.year}</span>
    <span>${formatDuration(movie.duration)}</span>
    <span>${movie.genres.join(' · ')}</span>
  `;
  document.getElementById('modalDesc').textContent = movie.desc;

  const saved = state.myList.includes(movie.id);
  document.getElementById('modalActions').innerHTML = `
    <button class="btn btn-primary" onclick="playMovie(${movie.id})">▶ Reproducir</button>
    <button class="btn btn-secondary" onclick="toggleList(${movie.id}); closeModal();">
      ${saved ? '✓ Quitar de Mi lista' : '+ Agregar a Mi lista'}
    </button>
  `;

  renderStars(movie.id);
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  currentModalId = null;
}

function renderStars(movieId) {
  const userRating = state.ratings[movieId] || 0;
  const container = document.getElementById('starRating');
  container.innerHTML = [1, 2, 3, 4, 5].map(n => `
    <span class="star ${n <= userRating ? 'filled' : ''}" onclick="rateMovie(${movieId}, ${n})">★</span>
  `).join('');
}

function rateMovie(movieId, rating) {
  state.ratings[movieId] = rating;
  save();
  renderStars(movieId);
  toast(`Puntuaste con ${rating} estrella${rating !== 1 ? 's' : ''}`);
}

// ============ PLAYER ============
function playMovie(id) {
  const movie = MOVIES.find(m => m.id === id);
  if (!movie) return;
  playMovieData(movie);
}

function playHero() {
  playMovieData(heroMovie);
}

function playMovieData(movie) {
  closeModal();
  document.getElementById('playerTitle').textContent = movie.title;
  document.getElementById('playerBg').style.background = gradientFor(movie);
  document.getElementById('player').classList.add('show');
  document.body.style.overflow = 'hidden';

  const totalSec = movie.duration * 60;
  const fill = document.getElementById('playerProgress');
  fill.style.width = '0%';

  let current = 0;
  clearInterval(window._playerTimer);
  window._playerTimer = setInterval(() => {
    current += totalSec / 60;
    if (current >= totalSec) {
      current = totalSec;
      clearInterval(window._playerTimer);
    }
    const pct = (current / totalSec) * 100;
    fill.style.width = pct + '%';
    document.getElementById('playerCurrent').textContent = formatTime(current);
  }, 100);

  document.getElementById('playerDuration').textContent = formatTime(totalSec);
}

function formatTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function closePlayer() {
  document.getElementById('player').classList.remove('show');
  document.body.style.overflow = '';
  clearInterval(window._playerTimer);
}

// ============ NAV ============
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
}, { passive: true });

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ============ INIT ============
load();
heroMovie = MOVIES[Math.floor(Math.random() * 3)];
renderHero();
renderGenres();
renderRows();
renderMyList();
renderRecommendations();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closePlayer();
  }
});
</script>
</body>
</html>
